version: '3.9'

services:

  # ─────────────────────────────────────────────────────────────────────
  # MySQL Database
  # ─────────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: novis-mysql
    environment:
      MYSQL_ROOT_PASSWORD: novis_root
      MYSQL_DATABASE: novisdb
      MYSQL_USER: novis
      MYSQL_PASSWORD: novis_pass
    ports:
      - "3306:3306"
    volumes:
      - novis-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "novis", "-pnovis_pass"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - novis-network

  # ─────────────────────────────────────────────────────────────────────
  # Spring Boot Backend
  # ─────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./novis-backend
      dockerfile: Dockerfile
    container_name: novis-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/novisdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: novis
      SPRING_DATASOURCE_PASSWORD: novis_pass
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - novis-uploads:/app/uploads
    networks:
      - novis-network
    restart: on-failure

  # ─────────────────────────────────────────────────────────────────────
  # React Frontend (served via Nginx)
  # ─────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./novis-frontend
      dockerfile: Dockerfile
    container_name: novis-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - novis-network
    restart: on-failure

volumes:
  novis-mysql-data:
  novis-uploads:

networks:
  novis-network:
    driver: bridge
